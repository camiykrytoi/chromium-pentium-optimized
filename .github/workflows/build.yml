name: Build LightBrowser
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages
          nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory packages
      - name: Build
        run: |
          ls -R packages/Microsoft.Web.WebView2*
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LightBrowser
          path: build/Release/LightBrowser.exe
