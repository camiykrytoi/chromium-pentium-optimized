name: Build Optimized Chromium

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Target Runner'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - self-hosted
      ui_style:
        description: 'UI Style & Theme'
        required: true
        default: 'Modern Refresh (Material 3 + Dark Accent)'
        type: choice
        options:
          - 'Modern Refresh (Material 3 + Dark Accent)'
          - 'Minimalist Compact UI'
      enable_codecs:
        description: 'Enable H.264 / HEVC / Widevine DRM'
        required: true
        default: true
        type: boolean
      enable_memory_saver:
        description: 'Pre-enable Memory Saver for 4GB RAM'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build (Runner: ${{ inputs.runner_type }})
    runs-on: ${{ inputs.runner_type }}
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Selected Build Options
        run: |
          echo "=== BUILD CONFIGURATION ==="
          echo "Runner: ${{ inputs.runner_type }}"
          echo "UI Style: ${{ inputs.ui_style }}"
          echo "Codecs: ${{ inputs.enable_codecs }}"
          echo "Memory Saver: ${{ inputs.enable_memory_saver }}"
          echo "Target CPU: Intel Pentium N3710 (SSE4.2, Airmont, no-AVX)"

      - name: Install depot_tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\depot_tools
          Invoke-WebRequest -Uri "https://storage.googleapis.com/chrome-infra/depot_tools.zip" -OutFile C:\depot_tools\depot_tools.zip
          Expand-Archive -Path C:\depot_tools\depot_tools.zip -DestinationPath C:\depot_tools -Force
          Remove-Item C:\depot_tools\depot_tools.zip
          $env:Path = "C:\depot_tools;" + $env:Path
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:DEPOT_TOOLS_WIN_TOOLCHAIN = "0"
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          gclient

      - name: Fetch Chromium Source Tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\chromium
          Set-Location C:\chromium
          fetch --no-history --no-hooks chromium
          Set-Location C:\chromium\src
          gclient runhooks

      - name: Apply UI & Preferences Customizations
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\chromium\src\out\Release
          Copy-Item -Path args.gn -Destination C:\chromium\src\out\Release\args.gn -Force
          Copy-Item -Path initial_preferences.json -Destination C:\chromium\src\out\Release\initial_preferences -Force
          Set-Location C:\chromium\src
          gn gen out\Release

      - name: Compile mini_installer.exe (autoninja)
        shell: pwsh
        run: |
          Set-Location C:\chromium\src
          autoninja -C out\Release mini_installer

      - name: Upload Chromium Installer
        uses: actions/upload-artifact@v4
        with:
          name: Chromium-Pentium-N3710-SSE42-CustomUI
          path: C:\chromium\src\out\Release\mini_installer.exe
          retention-days: 14