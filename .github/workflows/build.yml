name: Build Chromium

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Runner'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - 'windows-latest'
          - 'self-hosted'

jobs:
  build:
    name: Build Installer
    runs-on: ${{ github.event.inputs.runner_type }}
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Config
        run: |
          echo "Target CPU: Intel Pentium N3710 (SSE4.2, Airmont, no AVX)"
          echo "Selected Runner: ${{ github.event.inputs.runner_type }}"

      - name: Install depot_tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\depot_tools
          Invoke-WebRequest -Uri "https://storage.googleapis.com/chrome-infra/depot_tools.zip" -OutFile C:\depot_tools\depot_tools.zip
          Expand-Archive -Path C:\depot_tools\depot_tools.zip -DestinationPath C:\depot_tools -Force
          Remove-Item C:\depot_tools\depot_tools.zip
          $env:Path = "C:\depot_tools;" + $env:Path
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:DEPOT_TOOLS_WIN_TOOLCHAIN = "0"
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          gclient

      - name: Fetch Chromium Source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\chromium
          Set-Location C:\chromium
          fetch --no-history --no-hooks chromium
          Set-Location C:\chromium\src
          gclient runhooks

      - name: Setup GN Config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\chromium\src\out\Release
          Copy-Item -Path args.gn -Destination C:\chromium\src\out\Release\args.gn -Force
          Copy-Item -Path initial_preferences.json -Destination C:\chromium\src\out\Release\initial_preferences -Force
          Set-Location C:\chromium\src
          gn gen out\Release

      - name: Compile Installer (autoninja)
        shell: pwsh
        run: |
          Set-Location C:\chromium\src
          autoninja -C out\Release mini_installer

      - name: Upload Mini Installer
        uses: actions/upload-artifact@v4
        with:
          name: Chromium-Pentium-N3710-SSE42
          path: C:\chromium\src\out\Release\mini_installer.exe
          retention-days: 14
