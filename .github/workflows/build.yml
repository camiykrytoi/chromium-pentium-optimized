name: Build Chromium

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Installer
    runs-on: windows-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install depot_tools (Drive D:)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\depot_tools
          Invoke-WebRequest -Uri "https://storage.googleapis.com/chrome-infra/depot_tools.zip" -OutFile D:\depot_tools\depot_tools.zip
          Expand-Archive -Path D:\depot_tools\depot_tools.zip -DestinationPath D:\depot_tools -Force
          Remove-Item D:\depot_tools\depot_tools.zip
          $env:Path = "D:\depot_tools;" + $env:Path
          echo "D:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:DEPOT_TOOLS_WIN_TOOLCHAIN = "0"
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          gclient

      - name: Fetch Chromium Source (Drive D:)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\chromium
          Set-Location D:\chromium
          fetch --no-history --no-hooks chromium
          Set-Location D:\chromium\src
          gclient runhooks

      - name: Inject SDK Config and Setup GN
        shell: pwsh
        run: |
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include"
          $versions = Get-ChildItem -Path $sdkPath | Sort-Object Name -Descending
          $latestVersion = $versions[0].Name
          echo "Detected SDK Version: $latestVersion"
          
          # Inject version into args.gn
          echo "win_sdk_version = \"$latestVersion\"" | Out-File -FilePath D:\chromium\src\out\Release\args.gn -Append -Encoding ascii
          
          Copy-Item -Path args.gn -Destination D:\chromium\src\out\Release\args.gn -Force
          if (Test-Path initial_preferences.json) {
            Copy-Item -Path initial_preferences.json -Destination D:\chromium\src\out\Release\initial_preferences -Force
          }
          Set-Location D:\chromium\src
          gn gen out\Release

      - name: Compile Installer (autoninja)
        shell: pwsh
        run: |
          Set-Location D:\chromium\src
          autoninja -C out\Release mini_installer

      - name: Upload Mini Installer
        uses: actions/upload-artifact@v4
        with:
          name: Chromium-Pentium-N3710-SSE42
          path: D:\chromium\src\out\Release\mini_installer.exe
          retention-days: 14