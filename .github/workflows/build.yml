name: Build LightBrowser
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build . --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: LightBrowser
          path: build/Release/LightBrowser.exe